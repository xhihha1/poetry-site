<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7f5539">
  <title>離線詩歌</title>
  <link rel="icon" type="image/png" href="../icons/images.png">
  <link href="./apps.css" rel="stylesheet">

  <style>
    .main { padding: 12px 12px calc(20px + env(safe-area-inset-bottom, 0px)); }

    .card {
      max-width: 560px;
      margin: 0 auto 12px;
      padding: 14px;
      background: var(--panel);
      border-radius: 14px;
      color: var(--brown);
    }

    .card h2 { margin: 0 0 6px; font-size: 17px; }
    .card p { margin: 4px 0; font-size: 14px; line-height: 1.5; }
    .muted { opacity: 0.75; font-size: 13px; }

    .warn { background: #fff3cd; color: #7a5a00; }

    .book { display: flex; flex-direction: column; gap: 8px; }
    .book + .book { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--soft); }
    .book-head { display: flex; align-items: baseline; gap: 8px; }
    .book-name { font-size: 17px; font-weight: 800; }
    .book-size { font-size: 13px; opacity: 0.75; }
    .book-state { margin-left: auto; font-size: 14px; font-weight: 700; white-space: nowrap; }
    .book-state.done { color: #2a7f3e; }
    .book-state.update { color: #c97a12; }

    .bar { height: 8px; border-radius: 4px; background: #fff; overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: var(--brown); transition: width 0.2s; }

    .buttons { display: flex; gap: 8px; }

    .btn {
      flex: 1;
      height: 40px;
      padding: 0 12px;
      border: 2px solid var(--brown);
      border-radius: 20px;
      background: #fff;
      color: var(--brown);
      font-size: 15px;
      font-weight: 700;
    }

    .btn.primary { background: var(--brown); color: var(--panel); }
    .btn:disabled { opacity: 0.4; }

    .switch { display: flex; align-items: center; gap: 10px; font-weight: 700; margin: 6px 0; }
    .switch input { width: 22px; height: 22px; accent-color: var(--brown); }
  </style>
</head>

<body>
  <div class="topbar">
    <a href="./index.html" aria-label="回更多 APP">‹ APP</a>
    <h1>📥 離線詩歌</h1>
  </div>

  <div class="main">
    <div class="card warn" id="swWarn" hidden></div>

    <div class="card">
      <h2>說明</h2>
      <p>下載後，沒有網路（例如地下室）也能用詩歌：換書、輸入號碼、看歌譜都可以。</p>
      <p class="muted">建議連 Wi-Fi 時下載。iPhone 請在「加到主畫面」的那個詩歌 App 裡下載，Safari 和主畫面 App 的資料是分開存的。</p>
      <p class="muted" id="storageInfo"></p>
    </div>

    <div class="card">
      <h2>詩歌本</h2>
      <div id="books"><p>載入中…</p></div>
    </div>

    <div class="card">
      <h2>看過的詩歌</h2>
      <label class="switch"><input type="checkbox" id="autoSave"> 有網路時看過的詩歌自動存起來</label>
      <p class="muted" id="viewedInfo"></p>
      <div class="buttons"><button class="btn" id="clearViewed">清除看過的</button></div>
    </div>
  </div>

  <script>
    var ROOT = new URL('../', location.href);
    var SETTINGS_CACHE = 'offline-settings';
    var SETTINGS_URL = new URL('./__offline-settings', ROOT).href;
    var META_URL = new URL('./__offline-meta', ROOT).href;
    var VIEWED_CACHE = 'songs-viewed';
    var PARALLEL = 4;

    var $ = function (id) { return document.getElementById(id); };
    var index = null;
    var meta = {};          // book code -> {path: hash} of what is in that book's cache
    var running = {};       // book code -> {done, total, cancel}

    function bookCache(code) { return 'songs-' + code; }
    function mb(bytes) { return (bytes / 1048576).toFixed(bytes < 10485760 ? 1 : 0) + ' MB'; }

    // ---------- small stores kept in Cache Storage (the service worker reads them too) ----------

    function readJson(url) {
      return caches.open(SETTINGS_CACHE)
        .then(function (c) { return c.match(url); })
        .then(function (r) { return r ? r.json() : null; })
        .catch(function () { return null; });
    }

    function writeJson(url, value) {
      return caches.open(SETTINGS_CACHE).then(function (c) {
        return c.put(url, new Response(JSON.stringify(value), { headers: { 'Content-Type': 'application/json' } }));
      });
    }

    // ---------- status ----------

    function bookStatus(book) {
      var have = meta[book.code] || {};
      var missing = 0;
      var changed = 0;
      var bytes = 0;
      book.files.forEach(function (f) {
        if (!(f[0] in have)) { missing++; bytes += f[1]; }
        else if (have[f[0]] !== f[2]) { changed++; bytes += f[1]; }
      });
      var stored = Object.keys(have).length;
      return { missing: missing, changed: changed, todo: missing + changed, bytes: bytes, stored: stored };
    }

    function render() {
      var wrap = $('books');
      wrap.innerHTML = '';
      index.books.forEach(function (book) {
        var total = book.files.reduce(function (s, f) { return s + f[1]; }, 0);
        var st = bookStatus(book);
        var run = running[book.code];
        var songs = book.files.filter(function (f) { return /\.webp$/.test(f[0]); }).length;

        var el = document.createElement('div');
        el.className = 'book';
        var state;
        var cls = '';
        if (run) state = '下載中 ' + run.done + '/' + run.total;
        else if (!st.stored) state = '未下載';
        else if (!st.todo) { state = '✓ 已可離線'; cls = 'done'; }
        else { state = '有 ' + st.todo + ' 個新增/更新'; cls = 'update'; }

        el.innerHTML =
          '<div class="book-head"><span class="book-name"></span><span class="book-size"></span>' +
          '<span class="book-state ' + cls + '"></span></div>' +
          '<div class="bar"><div></div></div>' +
          '<div class="buttons"></div>';
        el.querySelector('.book-name').textContent = book.name;
        el.querySelector('.book-size').textContent = songs + ' 頁 · ' + mb(total);
        el.querySelector('.book-state').textContent = state;
        var pct = run ? run.done / run.total : (book.files.length - st.todo) / book.files.length;
        el.querySelector('.bar > div').style.width = (st.stored || run ? pct * 100 : 0) + '%';

        var buttons = el.querySelector('.buttons');
        if (run) {
          var cancel = document.createElement('button');
          cancel.className = 'btn';
          cancel.textContent = '暫停';
          cancel.addEventListener('click', function () { run.cancel = true; });
          buttons.appendChild(cancel);
        } else {
          if (st.todo) {
            var dl = document.createElement('button');
            dl.className = 'btn primary';
            dl.textContent = (st.stored ? '下載剩下的 ' : '下載 ') + mb(st.bytes);
            dl.addEventListener('click', function () { download(book); });
            buttons.appendChild(dl);
          }
          if (st.stored) {
            var del = document.createElement('button');
            del.className = 'btn';
            del.textContent = '刪除';
            del.addEventListener('click', function () { remove(book); });
            buttons.appendChild(del);
          }
        }
        wrap.appendChild(el);
      });
      showStorage();
    }

    function showStorage() {
      if (!navigator.storage || !navigator.storage.estimate) return;
      navigator.storage.estimate().then(function (e) {
        var text = '這個 App 目前使用 ' + mb(e.usage || 0);
        if (e.quota) text += '，可用空間約 ' + mb(e.quota);
        $('storageInfo').textContent = text + '。';
      });
    }

    function showViewed() {
      caches.open(VIEWED_CACHE).then(function (c) { return c.keys(); }).then(function (keys) {
        $('viewedInfo').textContent = '目前存了 ' + keys.length + ' 頁看過的歌譜。';
      });
    }

    // ---------- download / delete ----------

    function download(book) {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      var have = meta[book.code] = meta[book.code] || {};
      var todo = book.files.filter(function (f) { return have[f[0]] !== f[2]; });
      var run = running[book.code] = { done: 0, total: todo.length, cancel: false, failed: 0 };
      var next = 0;
      var sinceSave = 0;

      return caches.open(bookCache(book.code)).then(function (cache) {
        function worker() {
          if (run.cancel || next >= todo.length) return Promise.resolve();
          var f = todo[next++];
          var url = new URL(f[0], ROOT).href;
          return fetch(url, { cache: 'reload' }).then(function (res) {
            if (!res.ok) throw new Error(res.status);
            return cache.put(url, res);
          }).then(function () {
            have[f[0]] = f[2];
            if (++sinceSave >= 25) { sinceSave = 0; writeJson(META_URL, meta); }
          }).catch(function () {
            run.failed++;
          }).then(function () {
            run.done++;
            render();
            return worker();
          });
        }
        var workers = [];
        for (var i = 0; i < PARALLEL; i++) workers.push(worker());
        return Promise.all(workers);
      }).then(function () {
        return writeJson(META_URL, meta);
      }).then(function () {
        delete running[book.code];
        render();
        if (run.failed) alert(book.name + '：有 ' + run.failed + ' 個檔案沒下載成功，請確認網路後按「下載剩下的」。');
      });
    }

    function remove(book) {
      if (!confirm('刪除「' + book.name + '」的離線資料？')) return;
      caches.delete(bookCache(book.code)).then(function () {
        delete meta[book.code];
        return writeJson(META_URL, meta);
      }).then(render);
    }

    // Drop cached files that are no longer part of the site (e.g. the old .png pages
    // after the switch to .webp) so they stop taking space and counting as downloaded.
    function pruneStale() {
      var jobs = index.books.map(function (book) {
        var have = meta[book.code];
        if (!have) return Promise.resolve();
        var current = {};
        book.files.forEach(function (f) { current[f[0]] = true; });
        var stale = Object.keys(have).filter(function (p) { return !current[p]; });
        if (!stale.length) return Promise.resolve();
        return caches.open(bookCache(book.code)).then(function (cache) {
          return Promise.all(stale.map(function (p) {
            delete have[p];
            return cache.delete(new URL(p, ROOT).href);
          }));
        });
      });
      var viewed = caches.open(VIEWED_CACHE).then(function (cache) {
        return cache.keys().then(function (keys) {
          return Promise.all(keys.filter(function (k) { return /\.png$/.test(k.url); })
            .map(function (k) { return cache.delete(k); }));
        });
      });
      return Promise.all(jobs.concat(viewed)).then(function () { return writeJson(META_URL, meta); });
    }

    // ---------- start ----------

    function checkServiceWorker() {
      var warn = $('swWarn');
      if (!('serviceWorker' in navigator) || !window.caches) {
        warn.textContent = '這個瀏覽器不支援離線功能。';
        warn.hidden = false;
        return false;
      }
      navigator.serviceWorker.register('../sw.js').then(function () {
        return navigator.serviceWorker.ready;
      }).then(function () {
        if (!navigator.serviceWorker.controller) {
          warn.textContent = '離線功能剛安裝好。下載完後請把詩歌 App 完全關掉再打開一次，離線才會生效。';
          warn.hidden = false;
        }
      });
      return true;
    }

    if (checkServiceWorker()) {
      Promise.all([
        fetch('../offline-songs.json', { cache: 'no-cache' }).then(function (r) {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        }),
        readJson(META_URL),
        readJson(SETTINGS_URL)
      ]).then(function (results) {
        index = results[0];
        meta = results[1] || {};
        $('autoSave').checked = !results[2] || results[2].autoSave !== false;
        return pruneStale();
      }).then(function () {
        render();
        showViewed();
      }).catch(function () {
        $('books').innerHTML = '<p>讀不到詩歌清單，請連上網路後再打開這頁。</p>';
      });
    }

    $('autoSave').addEventListener('change', function () {
      writeJson(SETTINGS_URL, { autoSave: $('autoSave').checked });
    });

    $('clearViewed').addEventListener('click', function () {
      caches.delete(VIEWED_CACHE).then(showViewed).then(showStorage);
    });

    window.addEventListener('beforeunload', function (e) {
      if (Object.keys(running).length) { e.preventDefault(); e.returnValue = ''; }
    });
  </script>
</body>

</html>
