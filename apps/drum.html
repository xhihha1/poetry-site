<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#7f5539">
  <title>鼓</title>
  <link rel="icon" type="image/png" href="../icons/images.png">
  <link href="./apps.css" rel="stylesheet">

  <style>
    .main { padding: 10px 10px calc(16px + env(safe-area-inset-bottom, 0px)); }

    .panel {
      max-width: 820px;
      margin: 0 auto 12px;
      padding: 10px;
      background: var(--panel);
      border-radius: 12px;
      color: var(--brown);
    }

    .panel h2 { margin: 0 0 8px; font-size: 15px; }

    /* ---------- live pads ---------- */

    .pads {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      touch-action: none;
    }

    .pad {
      height: 76px;
      border: 2px solid var(--brown);
      border-radius: 12px;
      background: #fff;
      color: var(--brown);
      font-size: 17px;
      font-weight: 700;
      transition: transform 0.05s;
    }

    .pad.hit { background: var(--brown); color: var(--panel); transform: scale(0.96); }

    /* ---------- sequencer ---------- */

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .controls button,
    .controls select {
      height: 38px;
      padding: 0 14px;
      border: 2px solid var(--brown);
      border-radius: 19px;
      background: #fff;
      color: var(--brown);
      font: inherit;
    }

    .controls button.on { background: var(--brown); color: var(--panel); }
    #bpm { flex: 1; min-width: 120px; accent-color: var(--brown); }
    #bpmLabel { min-width: 72px; }

    .grid { display: flex; flex-direction: column; gap: 6px; }

    .row { display: flex; align-items: center; gap: 6px; }

    .row-name {
      flex: 0 0 52px;
      font-size: 14px;
      font-weight: 700;
      text-align: right;
    }

    .steps {
      flex: 1;
      display: grid;
      gap: 3px;
    }

    .step {
      aspect-ratio: 1 / 1.3;
      min-width: 0;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: #fff;
    }

    .step.on { background: var(--brown); }
    .step.now { outline: 2px solid #c9a27a; outline-offset: -2px; }
    .step.on.now { background: #b5452b; }

    @media (max-width: 520px) {
      .row-name { flex-basis: 38px; font-size: 12px; }
      .steps { gap: 2px; }
      .pad { height: 64px; font-size: 15px; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <a href="./index.html" aria-label="回更多 APP">‹ APP</a>
    <h1>🥁 鼓</h1>
  </div>

  <div class="main">
    <div class="panel">
      <h2>打擊墊（點一下就打）</h2>
      <div class="pads" id="pads"></div>
    </div>

    <div class="panel">
      <h2>節奏機</h2>
      <div class="controls">
        <button id="playBtn">▶ 播放</button>
        <select id="presetSelect" aria-label="節奏範本"></select>
        <button id="clearBtn">清除</button>
      </div>
      <div class="controls">
        <span id="bpmLabel"></span>
        <input type="range" id="bpm" min="40" max="200" value="90">
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <script>
    var STEPS = 16;
    var STORE_KEY = 'apps-drum:pattern-v1';

    var TRACKS = [
      { id: 'kick', name: '大鼓' },
      { id: 'snare', name: '小鼓' },
      { id: 'hihat', name: '鈸' },
      { id: 'open', name: '開鈸' },
      { id: 'clap', name: '拍手' },
      { id: 'tom', name: '中鼓' }
    ];

    // patterns as strings: x = hit, . = rest
    var PRESETS = [
      { name: '基本 4/4', bpm: 90, rows: {
        kick:  'x.......x.......',
        snare: '....x.......x...',
        hihat: 'x.x.x.x.x.x.x.x.' } },
      { name: '流行', bpm: 100, rows: {
        kick:  'x......xx.x.....',
        snare: '....x.......x...',
        hihat: 'x.x.x.x.x.x.x.x.',
        open:  '..............x.' } },
      { name: '敬拜慢歌', bpm: 72, rows: {
        kick:  'x.........x.....',
        snare: '........x.......',
        hihat: 'x...x...x...x...',
        tom:   '..............x.' } },
      { name: '3/4 華爾滋', bpm: 96, rows: {
        kick:  'x...........',
        snare: '....x...x...',
        hihat: 'x...x...x...' }, steps: 12 },
      { name: '拍手', bpm: 110, rows: {
        kick:  'x...x...x...x...',
        clap:  '....x.......x...',
        hihat: '..x...x...x...x.' } }
    ];

    // ---------- audio ----------

    var ctx = null;
    var master = null;
    var noiseBuffer = null;

    function audio() {
      if (!ctx) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        ctx = new Ctx();
        var comp = ctx.createDynamicsCompressor();
        master = ctx.createGain();
        master.gain.value = 0.8;
        master.connect(comp);
        comp.connect(ctx.destination);
        noiseBuffer = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        var data = noiseBuffer.getChannelData(0);
        for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function envGain(t, peak, decay) {
      var g = ctx.createGain();
      g.gain.setValueAtTime(peak, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      g.connect(master);
      return g;
    }

    function noise(t, decay, dest, filterType, filterFreq) {
      var src = ctx.createBufferSource();
      src.buffer = noiseBuffer;
      var f = ctx.createBiquadFilter();
      f.type = filterType;
      f.frequency.value = filterFreq;
      src.connect(f);
      f.connect(dest);
      src.start(t);
      src.stop(t + decay + 0.05);
    }

    function tone(t, from, to, decay, dest, type) {
      var o = ctx.createOscillator();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(from, t);
      o.frequency.exponentialRampToValueAtTime(to, t + decay * 0.6);
      o.connect(dest);
      o.start(t);
      o.stop(t + decay + 0.05);
    }

    var SOUNDS = {
      kick: function (t) {
        tone(t, 150, 45, 0.45, envGain(t, 1.0, 0.45));
      },
      snare: function (t) {
        noise(t, 0.2, envGain(t, 0.6, 0.2), 'highpass', 1200);
        tone(t, 220, 160, 0.12, envGain(t, 0.5, 0.12), 'triangle');
      },
      hihat: function (t) {
        noise(t, 0.05, envGain(t, 0.35, 0.05), 'highpass', 7000);
      },
      open: function (t) {
        noise(t, 0.35, envGain(t, 0.3, 0.35), 'highpass', 6000);
      },
      clap: function (t) {
        // three quick bursts then a short tail
        [0, 0.012, 0.024].forEach(function (d) {
          noise(t + d, 0.02, envGain(t + d, 0.5, 0.02), 'bandpass', 1500);
        });
        noise(t + 0.03, 0.15, envGain(t + 0.03, 0.4, 0.15), 'bandpass', 1500);
      },
      tom: function (t) {
        tone(t, 200, 110, 0.35, envGain(t, 0.8, 0.35));
      }
    };

    function hit(id, t) {
      audio();
      SOUNDS[id](t === undefined ? ctx.currentTime : t);
    }

    // ---------- pattern state ----------

    var steps = STEPS;
    var pattern = {};

    function emptyPattern(n) {
      var p = {};
      TRACKS.forEach(function (tr) { p[tr.id] = new Array(n).fill(false); });
      return p;
    }

    function loadPreset(preset) {
      steps = preset.steps || STEPS;
      pattern = emptyPattern(steps);
      Object.keys(preset.rows).forEach(function (id) {
        for (var i = 0; i < steps; i++) pattern[id][i] = preset.rows[id][i] === 'x';
      });
      setBpm(preset.bpm);
    }

    function save() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({ steps: steps, bpm: bpm, pattern: pattern }));
      } catch (e) {}
    }

    function restore() {
      try {
        var saved = JSON.parse(localStorage.getItem(STORE_KEY));
        if (!saved || !saved.pattern) return false;
        steps = saved.steps || STEPS;
        pattern = emptyPattern(steps);
        TRACKS.forEach(function (tr) {
          var row = saved.pattern[tr.id] || [];
          for (var i = 0; i < steps; i++) pattern[tr.id][i] = !!row[i];
        });
        setBpm(saved.bpm || 90);
        return true;
      } catch (e) {
        return false;
      }
    }

    // ---------- UI ----------

    var padsEl = document.getElementById('pads');
    TRACKS.forEach(function (tr) {
      var b = document.createElement('button');
      b.className = 'pad';
      b.textContent = tr.name;
      b.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        hit(tr.id);
        b.classList.add('hit');
        setTimeout(function () { b.classList.remove('hit'); }, 90);
      });
      padsEl.appendChild(b);
    });

    var gridEl = document.getElementById('grid');
    var stepEls = [];   // [step][track] -> button

    function renderGrid() {
      gridEl.innerHTML = '';
      stepEls = [];
      for (var s = 0; s < steps; s++) stepEls.push([]);
      TRACKS.forEach(function (tr) {
        var row = document.createElement('div');
        row.className = 'row';
        var name = document.createElement('div');
        name.className = 'row-name';
        name.textContent = tr.name;
        row.appendChild(name);
        var cells = document.createElement('div');
        cells.className = 'steps';
        // a narrow spacer column after every beat (4 steps)
        var cols = [];
        for (var c = 0; c < steps; c++) {
          cols.push('1fr');
          if (c % 4 === 3 && c < steps - 1) cols.push('3px');
        }
        cells.style.gridTemplateColumns = cols.join(' ');
        for (var s = 0; s < steps; s++) {
          (function (s) {
            var b = document.createElement('button');
            b.className = 'step' + (pattern[tr.id][s] ? ' on' : '');
            b.style.gridColumn = s + Math.floor(s / 4) + 1;
            b.setAttribute('aria-label', tr.name + ' 第 ' + (s + 1) + ' 格');
            b.addEventListener('click', function () {
              pattern[tr.id][s] = !pattern[tr.id][s];
              b.classList.toggle('on', pattern[tr.id][s]);
              if (pattern[tr.id][s] && !playing) hit(tr.id);
              save();
            });
            cells.appendChild(b);
            stepEls[s].push(b);
          })(s);
        }
        row.appendChild(cells);
        gridEl.appendChild(row);
      });
    }

    var bpm = 90;
    var bpmInput = document.getElementById('bpm');
    function setBpm(v) {
      bpm = Number(v);
      bpmInput.value = bpm;
      document.getElementById('bpmLabel').textContent = '速度 ' + bpm;
    }
    bpmInput.addEventListener('input', function () { setBpm(bpmInput.value); save(); });

    var presetSelect = document.getElementById('presetSelect');
    var placeholder = document.createElement('option');
    placeholder.textContent = '節奏範本…';
    placeholder.value = '';
    presetSelect.appendChild(placeholder);
    PRESETS.forEach(function (p, i) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.name;
      presetSelect.appendChild(opt);
    });
    presetSelect.addEventListener('change', function () {
      if (presetSelect.value === '') return;
      loadPreset(PRESETS[Number(presetSelect.value)]);
      presetSelect.value = '';
      currentStep = 0;
      renderGrid();
      save();
    });

    document.getElementById('clearBtn').addEventListener('click', function () {
      pattern = emptyPattern(steps);
      renderGrid();
      save();
    });

    // ---------- scheduler (look-ahead so timing stays steady) ----------

    var playing = false;
    var currentStep = 0;
    var nextTime = 0;
    var timer = null;
    var shownStep = -1;
    var LOOKAHEAD = 0.1;

    function stepDuration() {
      return 60 / bpm / 4;   // 16th notes
    }

    function schedule() {
      while (nextTime < ctx.currentTime + LOOKAHEAD) {
        var s = currentStep;
        TRACKS.forEach(function (tr) {
          if (pattern[tr.id][s]) SOUNDS[tr.id](nextTime);
        });
        showStepAt(s, nextTime);
        nextTime += stepDuration();
        currentStep = (currentStep + 1) % steps;
      }
    }

    function showStepAt(s, time) {
      var delay = Math.max(0, (time - ctx.currentTime) * 1000);
      setTimeout(function () {
        if (!playing) return;
        highlight(s);
      }, delay);
    }

    function highlight(s) {
      if (shownStep >= 0 && stepEls[shownStep]) {
        stepEls[shownStep].forEach(function (b) { b.classList.remove('now'); });
      }
      shownStep = s;
      if (s >= 0 && stepEls[s]) stepEls[s].forEach(function (b) { b.classList.add('now'); });
    }

    var playBtn = document.getElementById('playBtn');
    function start() {
      audio();
      playing = true;
      currentStep = 0;
      nextTime = ctx.currentTime + 0.05;
      schedule();
      timer = setInterval(schedule, 25);
      playBtn.textContent = '■ 停止';
      playBtn.classList.add('on');
    }

    function stop() {
      playing = false;
      clearInterval(timer);
      highlight(-1);
      playBtn.textContent = '▶ 播放';
      playBtn.classList.remove('on');
    }

    playBtn.addEventListener('click', function () { playing ? stop() : start(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden && playing) stop(); });

    if (!restore()) loadPreset(PRESETS[0]);
    renderGrid();
  </script>
</body>

</html>
